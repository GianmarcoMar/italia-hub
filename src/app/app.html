<app-map class="map-area" />

<header class="topbar">
  <button type="button" class="brand" (click)="actions.focusItaly()" aria-label="Italia Hub: quadro nazionale" title="Quadro nazionale">
    <span class="flag" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="name mono">ITALIA<b>//</b>HUB</span>
  </button>

  <button type="button" class="tool" (click)="ui.railOpen.set(!ui.railOpen())" [attr.aria-pressed]="ui.railOpen()" aria-label="Layer e feed">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m12 3 9 5-9 5-9-5 9-5Z" />
      <path d="m3 13 9 5 9-5" />
    </svg>
    <span>Layer</span>
  </button>

  <button type="button" class="tool" (click)="ui.openAnalysis()" [attr.aria-pressed]="ui.analysisOpen() && !ui.analysisMin()" aria-label="Analisi incrociata dei dati">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
    </svg>
    <span>Analisi</span>
  </button>

  <button type="button" class="cmdk" (click)="palette.toggle()" aria-label="Apri ricerca e comandi">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-4-4" />
    </svg>
    <span>Cerca comuni, province, regioni, eventi, comandi…</span>
    <kbd>Ctrl K</kbd>
  </button>

  <app-status />

  <button type="button" class="tool" (click)="ui.sourcesOpen.set(true)" aria-label="Fonti e licenze">Fonti</button>
  <button type="button" class="theme" (click)="theme.toggle()" [attr.aria-label]="'Tema ' + (theme.theme() === 'dark' ? 'chiaro' : 'scuro')">
    {{ theme.theme() === 'dark' ? '☀' : '☾' }}
  </button>
</header>

@if (ui.railOpen()) {
  <aside class="rail" aria-label="Layer e feed">
    <app-layers-panel />
    <!-- feed e timeline arrivano subito dopo il primo disegno (pezzi separati del bundle) -->
    @defer (on idle) {
      <app-feed />
    } @placeholder {
      <div class="skeleton" style="height: 160px"></div>
    }
  </aside>
}

@if (sel.panelOpen()) {
  <app-inspector class="inspector" />
}

@defer (on idle) {
  <app-timeline class="timebar" />
}

<!-- la dashboard (con i suoi grafici) si scarica solo alla prima apertura -->
@defer (when ui.analysisOpen()) {
  <app-dashboard />
}

<!-- caricate a pagina pronta: non servono al primo disegno -->
@defer (on idle) {
  <app-command-palette />
  <app-sources-dialog />
}
